<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4956A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#8B7355"/>
  
  <!-- Hotel Building -->
  <rect x="200" y="150" width="400" height="300" fill="url(#buildingGradient)" rx="5"/>
  
  <!-- Windows -->
  <g fill="#FFD700">
    <rect x="220" y="180" width="60" height="40" rx="2"/>
    <rect x="300" y="180" width="60" height="40" rx="2"/>
    <rect x="380" y="180" width="60" height="40" rx="2"/>
    <rect x="460" y="180" width="60" height="40" rx="2"/>
    
    <rect x="220" y="240" width="60" height="40" rx="2"/>
    <rect x="300" y="240" width="60" height="40" rx="2"/>
    <rect x="380" y="240" width="60" height="40" rx="2"/>
    <rect x="460" y="240" width="60" height="40" rx="2"/>
    
    <rect x="220" y="300" width="60" height="40" rx="2"/>
    <rect x="300" y="300" width="60" height="40" rx="2"/>
    <rect x="380" y="300" width="60" height="40" rx="2"/>
    <rect x="460" y="300" width="60" height="40" rx="2"/>
    
    <rect x="220" y="360" width="60" height="40" rx="2"/>
    <rect x="300" y="360" width="60" height="40" rx="2"/>
    <rect x="380" y="360" width="60" height="40" rx="2"/>
    <rect x="460" y="360" width="60" height="40" rx="2"/>
  </g>
  
  <!-- Hotel Entrance -->
  <rect x="350" y="400" width="100" height="50" fill="#8B4513" rx="2"/>
  <rect x="365" y="410" width="70" height="40" fill="#654321" rx="2"/>
  
  <!-- Roof -->
  <polygon points="180,150 400,50 620,150" fill="#8B4513"/>
  
  <!-- Crown Icon on Roof -->
  <circle cx="400" cy="120" r="20" fill="#FFD700"/>
  <path d="M380,120 L400,80 L420,120" fill="#FFD700"/>
  
  <!-- Bamboo Trees -->
  <g fill="#228B22">
    <rect x="80" y="200" width="8" height="250" rx="4"/>
    <rect x="120" y="180" width="8" height="270" rx="4"/>
    <rect x="680" y="190" width="8" height="260" rx="4"/>
    <rect x="720" y="170" width="8" height="280" rx="4"/>
  </g>
  
  <!-- Bamboo Leaves -->
  <g fill="#32CD32">
    <ellipse cx="84" cy="180" rx="20" ry="8"/>
    <ellipse cx="124" cy="160" rx="20" ry="8"/>
    <ellipse cx="684" cy="170" rx="20" ry="8"/>
    <ellipse cx="724" cy="150" rx="20" ry="8"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#8B4513" font-weight="bold">
    Crown Jewel Hotel
  </text>
</svg>